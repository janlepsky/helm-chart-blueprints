# preview-environments — per-PR preview deployments via ArgoCD + native mogenius UI.
#
# The chart renders four things (each toggleable):
#   1. an ArgoCD ApplicationSet with a GitHub pullRequest generator (one env per
#      labelled PR, per watched repo)
#   2. a UIConfig that makes the ApplicationSet editable in the mogenius UI
#   3. a UIConfig that surfaces the generated ArgoCD Applications in the UI
#   4. a Workspace + WorkspaceDashboard that groups the preview apps
#
# The preview app itself is an opinionated two-tier (backend + frontend) demo
# shape, matching the preview-demo boilerplates. Names, ports, domain, registry
# and secrets are all configurable below.

# ── GitHub source ──────────────────────────────────────────────────────────
github:
  # -- GitHub org/user that owns the watched repositories.
  owner: janlepsky
  # -- PR label that triggers a preview environment.
  label: preview
  # -- Secret (in the ArgoCD namespace) holding the GitHub token the pullRequest
  # generator uses to poll for open PRs.
  tokenSecretName: preview-demo-gitops
  # -- Key inside that secret.
  tokenSecretKey: password
  # -- How often (seconds) the generator re-checks GitHub for PR changes.
  requeueAfterSeconds: 60
  # -- Repositories to watch. Each labelled PR gets ONE preview of that repo's
  # app. `port` is the container port the app listens on (exposed as :80).
  # The image pushed by CI must be ghcr.io/<owner>/<name>:<head-short-sha>.
  repos:
    - name: off-backend-boilerplate
      port: 3000
    - name: off-frontend-boilerplate
      port: 80

# ── Preview deployment / exposure ──────────────────────────────────────────
preview:
  # -- Base domain. The preview host becomes <repo>-pr-<n>.<domain>.
  domain: demo.janlepsky.com
  # -- Container registry the CI pipelines push preview images to. The image
  # name equals the repo name, tagged with the PR head short SHA.
  registry: ghcr.io/janlepsky
  # -- Name of the image pull secret mounted into every preview namespace.
  imagePullSecretName: image-pull-secret-ghcr-u4qo1g

# ── ArgoCD ─────────────────────────────────────────────────────────────────
argocd:
  # -- Namespace ArgoCD (and the ApplicationSet) live in.
  namespace: mogenius-argo-cd
  # -- ArgoCD AppProject the generated Applications belong to.
  project: mogenius
  # -- ArgoCD destination cluster name.
  destinationName: in-cluster

# ── moac render chart (turns valuesObject into raw K8s objects) ─────────────
moac:
  repoURL: https://helm.mogenius.com/public
  chart: moac
  version: "1.2.3"

# ── Ingress / TLS ──────────────────────────────────────────────────────────
ingress:
  className: traefik
  clusterIssuer: letsencrypt-cluster-issuer

# ── Image pull secret delivered into each preview namespace (SealedSecret) ──
imagePullSecret:
  # -- Create the SealedSecret in every preview namespace. Set false if you
  # provide the pull secret another way.
  enabled: true
  # -- Sealed (encrypted) .dockerconfigjson produced by kubeseal for the target
  # cluster. The default below is the value from the original preview-demo setup.
  sealedDockerConfigJson: ""
  # -- Mark the SealedSecret cluster-wide so the same ciphertext decrypts in any namespace.
  clusterWide: true

# ── mogenius UI surfacing ──────────────────────────────────────────────────
ui:
  # -- UIConfig making the ApplicationSet editable in the mogenius UI.
  applicationSetUIConfig: true
  # -- UIConfig surfacing the generated ArgoCD Applications in the mogenius UI.
  applicationUIConfig: true
  # -- Namespace the Workspace + WorkspaceDashboard are created in. The operator
  # resolves WorkspaceDashboards from the `mogenius` namespace — leave as is.
  workspaceNamespace: mogenius
  workspace:
    # -- Create a Workspace that groups the preview namespaces/apps.
    enabled: true
    name: preview-environments
    displayName: Preview Environments
    # -- Explicit resource bindings ({type,id,namespace}). Empty => scope to the
    # ArgoCD namespace (shows the ApplicationSet + generated preview Apps).
    # type is one of: namespace | helm | argocd | flux.
    resources: []
  dashboard:
    # -- Create a (non-default) WorkspaceDashboard for the preview Workspace.
    enabled: true
    name: preview-environments

# ── Kyverno: auto-join preview namespaces to the Workspace ──────────────────
# Solves the dynamic-binding gap: the Workspace cannot wildcard-bind per-PR
# namespaces, so a Kyverno "mutate existing" policy appends each preview namespace
# to the Workspace's spec.resources as it is created. Requires Kyverno installed
# on the cluster (blueprint: kyverno).
kyverno:
  # -- Create the ClusterPolicy + RBAC that auto-join preview namespaces to the
  # preview Workspace. Needs ui.workspace.enabled and Kyverno on the cluster.
  autoJoinWorkspace: true
  # -- Label applied to preview namespaces (via ArgoCD managedNamespaceMetadata)
  # and matched by the policy. Always set on the namespaces regardless of the
  # toggle above (harmless when Kyverno is absent).
  previewNamespaceLabel: mogenius.com/preview
