{{- range $repo := .Values.github.repos }}
{{- $name := $repo.name }}
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  namespace: {{ $.Values.argocd.namespace }}
  labels:
    managed-by: mogenius
    {{- include "pe.labels" $ | nindent 4 }}
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - pullRequest:
        github:
          owner: {{ $.Values.github.owner }}
          repo: {{ $name }}
          labels:
            - {{ $.Values.github.label }}
          tokenRef:
            secretName: {{ $.Values.github.tokenSecretName }}
            key: {{ $.Values.github.tokenSecretKey }}
        requeueAfterSeconds: {{ $.Values.github.requeueAfterSeconds }}
  template:
    metadata:
      name: 'preview-{{ $name }}-pr-{{ include "pe.number" $ }}'
      labels:
        managed-by: mogenius
        preview: "true"
      annotations:
        notifications.argoproj.io/subscribe.on-deployed.github: "{{ $.Values.github.owner }}/{{ $name }}"
        preview.mogenius.com/host: "{{ $name }}-pr-{{ include "pe.number" $ }}.{{ $.Values.preview.domain }}"
        preview.mogenius.com/pr-number: "{{ include "pe.number" $ }}"
    spec:
      project: {{ $.Values.argocd.project }}
      source:
        repoURL: {{ $.Values.moac.repoURL }}
        targetRevision: {{ $.Values.moac.version | quote }}
        chart: {{ $.Values.moac.chart }}
        helm:
          releaseName: 'preview-{{ $name }}-{{ include "pe.number" $ }}'
          valuesObject:
            services:
              - {{ $name }}:
                  ports:
                    - name: http
                      port: 80
                      protocol: TCP
                      targetPort: {{ $repo.port }}
                  selector:
                    app: {{ $name }}
                  type: ClusterIP
            ingresses:
              - ingress-{{ $name }}:
                  annotations:
                    cert-manager.io/cluster-issuer: {{ $.Values.ingress.clusterIssuer }}
                  ingressClassName: {{ $.Values.ingress.className }}
                  rules:
                    - host: '{{ $name }}-pr-{{ include "pe.number" $ }}.{{ $.Values.preview.domain }}'
                      http:
                        paths:
                          - backend:
                              service:
                                name: {{ $name }}
                                port:
                                  number: 80
                            path: /
                            pathType: Prefix
                  tls:
                    - hosts:
                        - '{{ $name }}-pr-{{ include "pe.number" $ }}.{{ $.Values.preview.domain }}'
                      secretName: 'preview-{{ $name }}-pr-{{ include "pe.number" $ }}-tls'
            rawResources:
{{- if $.Values.imagePullSecret.enabled }}
              - apiVersion: bitnami.com/v1alpha1
                kind: SealedSecret
                metadata:
                  annotations:
                    sealedsecrets.bitnami.com/cluster-wide: {{ $.Values.imagePullSecret.clusterWide | quote }}
                  name: {{ $.Values.preview.imagePullSecretName }}
                spec:
                  encryptedData:
                    .dockerconfigjson: {{ $.Values.imagePullSecret.sealedDockerConfigJson }}
                  template:
                    metadata:
                      annotations:
                        sealedsecrets.bitnami.com/cluster-wide: {{ $.Values.imagePullSecret.clusterWide | quote }}
                      name: {{ $.Values.preview.imagePullSecretName }}
                    type: kubernetes.io/dockerconfigjson
{{- end }}
              - apiVersion: apps/v1
                kind: Deployment
                metadata:
                  name: {{ $name }}
                spec:
                  replicas: 1
                  selector:
                    matchLabels:
                      app: {{ $name }}
                  template:
                    metadata:
                      labels:
                        app: {{ $name }}
                    spec:
                      containers:
                        - name: {{ $name }}
                          image: '{{ $.Values.preview.registry }}/{{ $name }}:{{ include "pe.headShortSha" $ }}'
                          imagePullPolicy: Always
                      imagePullSecrets:
                        - name: {{ $.Values.preview.imagePullSecretName }}
      destination:
        name: {{ $.Values.argocd.destinationName }}
        namespace: 'preview-{{ include "pe.branchNs" $ }}'
      syncPolicy:
        managedNamespaceMetadata:
          labels:
            {{ $.Values.kyverno.previewNamespaceLabel }}: "true"
        automated:
          prune: true
          selfHeal: true
          allowEmpty: true
        syncOptions:
          - CreateNamespace=true
---
{{- end }}
