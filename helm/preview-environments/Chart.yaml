apiVersion: v2
name: preview-environments
description: Per-pull-request preview environments for one or more GitHub repos, driven by an ArgoCD ApplicationSet (pullRequest generator) and surfaced natively in the mogenius UI (UIConfig + Workspace + Dashboard). Each labelled PR gets its own namespace, hosts and TLS; closing the PR tears it down.
type: application
version: 0.1.3
appVersion: "1.0.0"
keywords:
  - preview
  - pull-request
  - gitops
  - argocd
  - applicationset
  - mogenius
