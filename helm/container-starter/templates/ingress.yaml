{{- if and .Values.ingress.enabled .Values.ingress.host }}
{{- $fullname := include "container-starter.fullname" . -}}
{{- $tls := .Values.ingress.tls | default dict -}}
{{- $annotations := .Values.ingress.annotations | default dict -}}
{{- if and $tls.enabled $tls.clusterIssuer }}
{{- $annotations = merge (dict "cert-manager.io/cluster-issuer" $tls.clusterIssuer) $annotations -}}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "container-starter.labels" . | nindent 4 }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if $tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ $tls.secretName | default (printf "%s-tls" $fullname) }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ $fullname }}
                port:
                  number: {{ .Values.port }}
{{- end }}
