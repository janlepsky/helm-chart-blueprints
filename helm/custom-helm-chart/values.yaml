application:
  name: example
  domain: example.com
  port: 8080

  replicas: 1
  revisionHistoryLimit: 1
  annotations: {}

  strategy: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

  # -- override the container entrypoint
  command: []

  # -- override the container command arguments
  args: []

  # -- additional labels to be placed on the deployment
  additionalLabels: {}

  # Disable all probes
  probe:
    startup:
      enabled: false
    readiness:
      enabled: false
    liveness:
      enabled: false

image:
  registry: "docker.io"
  repository: ~
  tag: ~
  pullPolicy: "IfNotPresent"

imagePullSecrets: []

ingress:
  enabled: true
  ingressClassName: contour
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod-dns

entraSync:
  enabled: true
  # -- Name of the Secret containing client-id, client-secret, tenant-id
  secretName: entra-sync-credentials
  # -- Object ID of the shared Entra app registration to patch
  appObjectId: "xxxxxx-xxx-xxxxx-xxxx-xxxxxx"
  #
  # -- Create the automation service principal
  # az ad sp create-for-rbac --name "entra-redirect-sync" \
  # --years 2 \
  # --query "{client-id:appId, client-secret:password, tenant-id:tenant}"
  #
  #
  # kubectl create secret generic entra-sync-credentials \
  # --from-literal=client-id=<appId> \
  # --from-literal=client-secret=<password> \
  # --from-literal=tenant-id=<tenant>

oauth2Proxy:
  enabled: true
  image: "quay.io/oauth2-proxy/oauth2-proxy:v7.6.0"
  tenantId: xxxxxx-xxx-xxxxx-xxxx-xxxxxx
  # clientSecretName must match a Secret in the namespace containing:
  #   OAUTH2_PROXY_CLIENT_ID
  #   OAUTH2_PROXY_CLIENT_SECRET
  # Pin the cookie secret to avoid session invalidation on helm upgrade:
  # cookieSecret: <base64-32-random-bytes>

kpackWatcher:
  enabled: false
  image: alpine/k8s:1.32.9
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

# NOTE: when kpackWatcher.enabled=true, set image.pullPolicy to Always so
# the Deployment actually pulls the new image after the rollout restart.

deployFailureReporter:
  enabled: false
  image: alpine/k8s:1.32.9
  # -- "owner/repo" to file issues against. Leave unset to auto-derive it from
  # the kpack Image's spec.source.git.url (requires kpackWatcher's Image to
  # have a github.com git source; falls back to no issue creation otherwise).
  githubRepo: ~
  # -- Name of a Secret in this namespace with a "token" key (a GitHub PAT
  # or GitHub App installation token with "issues:write" on githubRepo)
  githubTokenSecretName: deploy-failure-reporter-github-token
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

automountServiceAccountToken: false

securityContext:
  pod: {}
  container: {}

resources: {}

labels: {}
env: []
volumeMounts: []
volumes: []
initContainers: []
