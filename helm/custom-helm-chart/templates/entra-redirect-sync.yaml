{{- if .Values.entraSync.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "app.name" . }}-entra-sync-script
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  sync-redirect-uri.sh: |
    #!/bin/sh
    set -e

    az login --service-principal \
      -u "$AZURE_CLIENT_ID" \
      -p "$AZURE_CLIENT_SECRET" \
      --tenant "$AZURE_TENANT_ID" \
      --allow-no-subscriptions > /dev/null

    CURRENT_URIS=$(az ad app show --id "$APP_OBJECT_ID" --query "web.redirectUris" -o json)

    if echo "$CURRENT_URIS" | jq -e --arg uri "$REDIRECT_URI" 'index($uri)' > /dev/null; then
      echo "Redirect URI already present, nothing to do: $REDIRECT_URI"
      exit 0
    fi

    NEW_URIS=$(echo "$CURRENT_URIS" | jq --arg uri "$REDIRECT_URI" '. + [$uri] | unique')

    az ad app update --id "$APP_OBJECT_ID" \
      --web-redirect-uris $(echo "$NEW_URIS" | jq -r '.[]')

    echo "Added redirect URI: $REDIRECT_URI"
  remove-redirect-uri.sh: |
    #!/bin/sh
    set -e

    az login --service-principal \
      -u "$AZURE_CLIENT_ID" \
      -p "$AZURE_CLIENT_SECRET" \
      --tenant "$AZURE_TENANT_ID" \
      --allow-no-subscriptions > /dev/null

    CURRENT_URIS=$(az ad app show --id "$APP_OBJECT_ID" --query "web.redirectUris" -o json)

    if ! echo "$CURRENT_URIS" | jq -e --arg uri "$REDIRECT_URI" 'index($uri)' > /dev/null; then
      echo "Redirect URI not present, nothing to do: $REDIRECT_URI"
      exit 0
    fi

    NEW_URIS=$(echo "$CURRENT_URIS" | jq --arg uri "$REDIRECT_URI" '[.[] | select(. != $uri)]')

    az ad app update --id "$APP_OBJECT_ID" \
      --web-redirect-uris $(echo "$NEW_URIS" | jq -r '.[]')

    echo "Removed redirect URI: $REDIRECT_URI"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "app.name" . }}-entra-redirect-sync
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: entra-redirect-sync
          image: mcr.microsoft.com/azure-cli:latest
          command: ["/bin/sh", "/scripts/sync-redirect-uri.sh"]
          env:
            - name: AZURE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.entraSync.secretName }}
                  key: client-id
            - name: AZURE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.entraSync.secretName }}
                  key: client-secret
            - name: AZURE_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.entraSync.secretName }}
                  key: tenant-id
            - name: APP_OBJECT_ID
              value: {{ .Values.entraSync.appObjectId | quote }}
            - name: REDIRECT_URI
              value: "https://{{ .Values.appName }}.{{ .Values.baseDomain }}/oauth2/callback"
          volumeMounts:
            - name: script
              mountPath: /scripts
      volumes:
        - name: script
          configMap:
            name: {{ include "app.name" . }}-entra-sync-script
            defaultMode: 0755
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "app.name" . }}-entra-redirect-remove
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: entra-redirect-remove
          image: mcr.microsoft.com/azure-cli:latest
          command: ["/bin/sh", "/scripts/remove-redirect-uri.sh"]
          env:
            - name: AZURE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.entraSync.secretName }}
                  key: client-id
            - name: AZURE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.entraSync.secretName }}
                  key: client-secret
            - name: AZURE_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.entraSync.secretName }}
                  key: tenant-id
            - name: APP_OBJECT_ID
              value: {{ .Values.entraSync.appObjectId | quote }}
            - name: REDIRECT_URI
              value: "https://{{ .Values.appName }}.{{ .Values.baseDomain }}/oauth2/callback"
          volumeMounts:
            - name: script
              mountPath: /scripts
      volumes:
        - name: script
          configMap:
            name: {{ include "app.name" . }}-entra-sync-script
            defaultMode: 0755
{{- end }}
