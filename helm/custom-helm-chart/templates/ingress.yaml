{{- $name := include "app.name" . -}}
{{- $labels := include "app.labels" . -}}
{{- $host := printf "%s.%s" .Values.appName .Values.baseDomain -}}

{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}-ingress
  labels:
    {{- if .Values.ingress.labels }}
    {{- toYaml .Values.ingress.labels | nindent 4 }}
    {{- else }}
    {{- $labels | nindent 4 }}
    {{- end }}
  annotations:
    kubernetes.io/ingress.class: {{ .Values.ingress.ingressClassName }}
    {{- if .Values.ingress.annotations }}
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.ingressClassName }}
  rules:
    - host: {{ $host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port:
                  number: {{ if .Values.oauth2Proxy.enabled }}4180{{ else }}{{ .Values.clusterip.port }}{{ end }}

  tls:
    - hosts:
        - {{ $host }}
      secretName: {{ printf "%s-%s-tls" .Values.appName (replace "." "-" .Values.baseDomain) }}
{{- end }}
