apiVersion: v1
kind: HelmBlueprint
metadata:
  id: workspace-azure-static-web-app
  displayName: Azure Static Web App
  description: Provision an Azure Static Web App via Crossplane's OpenTofu provider. A ready-to-edit template Workspace — change the name, location, SKU and tags and deploy. Backed by the generic crossplane-workspace chart.
  category: infrastructure
  icon: https://raw.githubusercontent.com/cncf/artwork/main/projects/crossplane/icon/color/crossplane-icon-color.svg
  tags:
    [
      crossplane,
      opentofu,
      terraform,
      azure,
      iac,
      infrastructure,
      static-web-app,
    ]
spec:
  repository:
    name: janlepsky-apps
    url: https://janlepsky.github.io/helm-chart-blueprints
  chart:
    name: janlepsky-apps/crossplane-swa
    version: "0.1.1"
  install:
    release: example-azure-static-web-app
    namespace: default
  values:
    location: "westeurope"
    tags:
      environment: demo
      managed-by: crossplane-opentofu
