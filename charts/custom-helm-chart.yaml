apiVersion: v1
kind: HelmBlueprint
metadata:
  id: custom-helm-chart
  displayName: Custom Helm Chart
  description: Provision a custom Helm Chart. Define input values freely. It uses oauth2-proxy as a sidecar.
  category: general
  icon: https://helm.sh/img/helm.svg
  tags: [helm, custom]
spec:
  repository:
    name: janlepsky-apps
    url: https://janlepsky.github.io/helm-chart-blueprints
  chart:
    name: janlepsky-apps/custom-helm-chart
    version: "0.1.1"
  install:
    release: custom-helm-chart
    namespace: default
  values:
    application:
      name: example
      domain: example.com
      port: 8080

      replicas: 1
      revisionHistoryLimit: 1
      annotations: {}

      strategy: RollingUpdate
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 0

      # -- override the container entrypoint
      command: []

      # -- override the container command arguments
      args: []

      # -- additional labels to be placed on the deployment
      additionalLabels: {}

      # Disable all probes
      probe:
        startup:
          enabled: false
        readiness:
          enabled: false
        liveness:
          enabled: false

    image:
      registry: "docker.io"
      repository: ~
      tag: ~
      pullPolicy: "IfNotPresent"

    imagePullSecrets: []

    ingress:
      enabled: true
      ingressClassName: contour
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod-dns

    entraSync:
      enabled: true
      # -- Name of the Secret containing client-id, client-secret, tenant-id
      secretName: entra-sync-credentials
      # -- Object ID of the shared Entra app registration to patch
      appObjectId: "xxxxxx-xxx-xxxxx-xxxx-xxxxxx"
      #
      # -- Create the automation service principal
      # az ad sp create-for-rbac --name "entra-redirect-sync" \
      # --years 2 \
      # --query "{client-id:appId, client-secret:password, tenant-id:tenant}"
      #
      #
      # kubectl create secret generic entra-sync-credentials \
      # --from-literal=client-id=<appId> \
      # --from-literal=client-secret=<password> \
      # --from-literal=tenant-id=<tenant>

    oauth2Proxy:
      enabled: true
      image: "quay.io/oauth2-proxy/oauth2-proxy:v7.6.0"
      tenantId: xxxxxx-xxx-xxxxx-xxxx-xxxxxx
      # clientSecretName must match a Secret in the namespace containing:
      #   OAUTH2_PROXY_CLIENT_ID
      #   OAUTH2_PROXY_CLIENT_SECRET
      # Pin the cookie secret to avoid session invalidation on helm upgrade:
      # cookieSecret: <base64-32-random-bytes>

    automountServiceAccountToken: false

    securityContext:
      pod: {}
      container: {}

    resources: {}

    labels: {}
    env: []
    volumeMounts: []
    volumes: []
    initContainers: []
