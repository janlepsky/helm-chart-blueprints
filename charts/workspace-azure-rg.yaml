apiVersion: v1
kind: HelmBlueprint
metadata:
  id: workspace-azure-rg
  displayName: Azure Resource Group
  description: Provision an Azure Resource Group via Crossplane's OpenTofu provider. A ready-to-edit template Workspace — change the name, location and tags and deploy. Backed by the generic crossplane-workspace chart.
  category: infrastructure
  icon: https://raw.githubusercontent.com/cncf/artwork/main/projects/crossplane/icon/color/crossplane-icon-color.svg
  tags: [crossplane, opentofu, terraform, azure, iac, infrastructure]
spec:
  repository:
    name: janlepsky-apps
    url: https://janlepsky.github.io/helm-chart-blueprints
  chart:
    name: janlepsky-apps/crossplane-workspace
    version: "0.1.2"
  install:
    release: example-azure-rg
    namespace: default
  values:
    name: "my-resource"
    location: "westeurope"
    tags:
      environment: demo
      managed-by: crossplane-opentofu
