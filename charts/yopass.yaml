apiVersion: v1
kind: HelmBlueprint
metadata:
  id: yopass
  displayName: Yopass
  description: Secure sharing of secrets, passwords and files via one-time, self-destructing encrypted links
  category: security
  icon: https://raw.githubusercontent.com/jhaals/yopass/master/logo/yopass.svg
  tags: [secrets, security, encryption, passwords, sharing]
spec:
  repository:
    name: cloudhippie
    url: https://cloudhippie.github.io/charts
  chart:
    name: cloudhippie/yopass
    version: "9.8.0"
  install:
    release: yopass
    namespace: yopass
  values: |
    # Yopass needs a storage backend for encrypted secrets.
    # The bundled memcached dependency matches the default DSN (memcached:11211).
    memcached:
      enabled: true
    database:
      type: memcached
      dsn: memcached:11211
    # Enable and configure ingress to expose the UI, e.g.:
    # ingress:
    #   enabled: true
    #   className: nginx
    #   hosts:
    #     - host: yopass.example.com
    #       paths:
    #         - path: /
    #           pathType: Prefix
    ingress:
      enabled: false
