apiVersion: v1
kind: HelmBlueprint
metadata:
  id: container
  displayName: Container
  description: Deploy any container image — just provide an image, a name and optionally a hostname. Deployment, Service and Ingress are generated automatically.
  category: miscellaneous
  icon: kubernetes
  tags: [container, deployment, app, custom]
spec:
  repository:
    name: janlepsky-apps
    url: https://janlepsky.github.io/helm-chart-blueprints
  chart:
    name: janlepsky-apps/container
    version: "0.1.0"
  install:
    release: my-app
    namespace: my-app
  values: |
    # Container image to deploy
    image:
      repository: nginx
      tag: "latest"

    # Port your application listens on
    port: 80

    # Set enabled: true and a host to expose the app publicly.
    # For automatic HTTPS, set tls.enabled: true and a cert-manager ClusterIssuer.
    ingress:
      enabled: false
      host: ""
      tls:
        enabled: false
        clusterIssuer: ""   # e.g. letsencrypt-prod

    # Optional: environment variables, replicas and resources
    env: []
    replicas: 1
